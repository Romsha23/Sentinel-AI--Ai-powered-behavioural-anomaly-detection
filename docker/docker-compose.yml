version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sentinel_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sentinel.db
      - SECRET_KEY=sentinel_ai_super_secret_jwt_key_2026_honeywell_demo
    volumes:
      - ../backend/sentinel.db:/app/backend/sentinel.db

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sentinel_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
